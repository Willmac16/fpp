name: Profile Scala Native FPP
description: Exercise instrumented FPP, build a matching F Prime revision, and merge profiles

inputs:
  profile-directory:
    description: Directory containing raw LLVM profiles
    required: true
  profile-file:
    description: Output path for the merged LLVM profile
    required: true
  python:
    description: Python interpreter used for the F Prime environment
    required: true
  fprime-directory:
    description: Temporary F Prime checkout path
    required: true
  fprime-venv:
    description: Temporary F Prime virtual environment path
    required: true

runs:
  using: composite
  steps:
    - name: Exercise FPP acceptance suite
      shell: bash
      working-directory: compiler
      env:
        LLVM_PROFILE_FILE: ${{ inputs.profile-directory }}/fpp-%m-%p.profraw
      run: ./test

    - name: Build matching F Prime revision
      shell: bash
      env:
        FPRIME_DIR: ${{ inputs.fprime-directory }}
        FPRIME_VENV: ${{ inputs.fprime-venv }}
        FPRIME_PYTHON: ${{ inputs.python }}
        LLVM_PROFILE_FILE: ${{ inputs.profile-directory }}/fpp-%m-%p.profraw
      run: "$GITHUB_ACTION_PATH/build-matching-fprime.sh"

    - name: Merge profiles
      shell: bash
      env:
        PROFILE_DIRECTORY: ${{ inputs.profile-directory }}
        PROFILE_FILE: ${{ inputs.profile-file }}
      run: |
        mkdir -p "$(dirname "$PROFILE_FILE")"
        if command -v llvm-profdata >/dev/null 2>&1
        then
          profdata=(llvm-profdata)
        elif command -v xcrun >/dev/null 2>&1 && \
          xcrun --find llvm-profdata >/dev/null 2>&1
        then
          profdata=(xcrun llvm-profdata)
        else
          echo "::error::llvm-profdata is not available"
          exit 127
        fi
        "${profdata[@]}" merge -o "$PROFILE_FILE" "$PROFILE_DIRECTORY"/*.profraw
        "${profdata[@]}" show "$PROFILE_FILE"
