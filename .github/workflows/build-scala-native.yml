name: Build Scala Native FPP Tools

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS leg disarmed for now — re-enable later (a fight for another day).
          # - runner: macos-15
          #   artifact: darwin-arm64
          #   python: '3.10'
          #   wheel_tag: macosx_14_0_arm64
          - runner: ubuntu-22.04
            artifact: manylinux_2_28_x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
            python: /opt/python/cp310-cp310/bin/python
            wheel_tag: manylinux_2_28_x86_64
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container || '' }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'

    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch full history and tags so `git describe --tags` can embed a
          # real version below (a shallow checkout has no tags).
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - name: Install sbt
        run: |
          curl --fail --location \
            https://github.com/sbt/sbt/releases/download/v1.10.11/sbt-1.10.11.tgz \
            | tar -xz --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sbt/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Linux'
        name: Install Linux build tools
        run: |
          dnf install --assumeyes clang llvm
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Show toolchain versions
        run: |
          java --version
          sbt --version
          clang --version
      - if: runner.os == 'macOS'
        name: Show macOS linker version
        run: |
          sw_vers
          xcodebuild -version
          ld -v
      - name: Embed version in Version.scala
        working-directory: compiler
        run: |
          # Embed the nearest release tag (v3.3.0a9 on this branch) so `fpp --help`
          # reports a clean version F Prime's tool version check can match against
          # its pinned requirement. `--abbrev=0` drops the `-<n>-g<sha>` suffix a
          # plain describe adds on commits past the tag; `--match 'v*'` ignores the
          # rolling CI release tag (fpp-scala-native-*) so it never gets embedded.
          # Fall back to $VERSION from version.sh when no matching tag is found.
          #
          # The manylinux leg runs as root in a container while the checkout is
          # owned by another uid, so git refuses with "detected dubious ownership"
          # and `git describe` exits non-zero -> the fallback silently hides the
          # real tag. Mark the workspace safe so describe works in the container
          # exactly as it does on the bare macOS runner.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . ../version.sh
          if git describe --tags --abbrev=0 --match 'v*' > /dev/null 2>&1
          then
            version=`git describe --tags --abbrev=0 --match 'v*'`
          else
            version="$VERSION"
          fi
          util=lib/src/main/scala/util
          echo "Updating version to $version"
          echo "FPP_VERSION=${version#v}" >> "$GITHUB_ENV"
          sed -i.update.bak -e "s/val v = .*/val v = \"$version\"/" \
            $util/Version.scala
      - if: runner.os == 'macOS'
        name: Build Scala Native tools
        uses: ./.github/actions/scala-native-build
        with:
          jvm-heap: 6G
      - if: runner.os == 'Linux'
        name: Build instrumented Scala Native tools
        uses: ./.github/actions/scala-native-build
        with:
          jvm-heap: 10G
          mode: releasefull
          lto: none
          pgo-mode: generate
          profile-directory: ${{ runner.temp }}/fpp-pgo
      - if: runner.os == 'Linux'
        name: Stage instrumented Scala Native tools
        uses: ./.github/actions/scala-native-stage
      - if: runner.os == 'Linux'
        name: Profile instrumented Scala Native tools
        uses: ./.github/actions/scala-native-profile
        with:
          fpp-version: ${{ env.FPP_VERSION }}
          profile-directory: ${{ runner.temp }}/fpp-pgo
          profile-file: ${{ github.workspace }}/compiler/pgo/fpp.profdata
          python: ${{ matrix.python }}
          fprime-directory: ${{ runner.temp }}/fprime
          fprime-venv: ${{ runner.temp }}/fprime-venv
      - if: runner.os == 'Linux'
        name: Build profile-guided Scala Native tools
        uses: ./.github/actions/scala-native-build
        with:
          jvm-heap: 10G
          mode: releasefull
          lto: full
          pgo-mode: apply
          profile-file: ${{ github.workspace }}/compiler/pgo/fpp.profdata
      - name: Restore Version.scala
        if: always()
        working-directory: compiler
        run: |
          # Restore the committed placeholder so no tracked file is left dirty,
          # exactly as compiler/install does after building.
          util=lib/src/main/scala/util
          echo "Restoring Version.scala"
          sed -i.restore.bak -e "s/val v = .*/val v = \"[unknown version]\"/" \
            $util/Version.scala
      - name: Stage Scala Native tools
        uses: ./.github/actions/scala-native-stage
      - name: Test Scala Native tools
        working-directory: compiler
        run: ./test
      - name: Package Scala Native tools
        working-directory: compiler
        run: |
          bundle="fpp-scala-native-${{ matrix.artifact }}"
          mkdir -p "$bundle"
          cp -a bin/. "$bundle"
          tar -czf "$bundle.tar.gz" "$bundle"
      - name: Build Python wheel
        run: |
          cp compiler/bin/fpp python/fprime_fpp/fpp
          chmod +x python/fprime_fpp/fpp
          touch python/fprime_fpp/fpp-native-all-tools
          uv run --python ${{ matrix.python }} --with build python -m build \
            --wheel --outdir dist \
            --config-setting=--build-option=--plat-name=${{ matrix.wheel_tag }} .
      - name: Install wheel with uv
        run: |
          wheel=$(find dist -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          printf 'fprime-fpp @ file://%s\n' "$(pwd)/$wheel" > overrides.txt
          uv venv .venv --python ${{ matrix.python }} --clear
          uv pip install --python .venv/bin/python --override overrides.txt fprime-fpp
          .venv/bin/fpp --help
          .venv/bin/fpp-to-json --help
      - name: Archive Scala Native tools
        uses: actions/upload-artifact@v7
        with:
          name: fpp-scala-native-${{ matrix.artifact }}
          path: |
            compiler/fpp-scala-native-${{ matrix.artifact }}.tar.gz
            dist/*.whl
          retention-days: 14
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download native build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: fpp-scala-native-*
          path: release
          merge-multiple: true
      - name: Derive release tag from branch
        id: rel
        run: |
          # One rolling release per branch: main -> ...-latest, release/a9 -> ...-a9.
          # Keeps each F Prime baseline (a9, a15, ...) on its own release without
          # per-branch workflow edits.
          slug="${GITHUB_REF_NAME##*/}"
          if [ "$slug" = "main" ]; then slug="latest"; fi
          echo "tag=fpp-scala-native-$slug" >> "$GITHUB_OUTPUT"
      - name: Create release assets
        run: |
          tag='${{ steps.rel.outputs.tag }}'
          base_url="https://github.com/${{ github.repository }}/releases/download/$tag"
          # macOS leg disarmed — linux-only publish for now.
          linux_wheel=$(find release -type f -name '*manylinux_*_x86_64.whl' -print -quit)
          test -n "$linux_wheel"
          # Downloaded artifacts keep their internal layout
          # (release/dist/*.whl and release/compiler/*.tar.gz), so flatten the
          # real files into release/ root where the publish globs look for them.
          cp "$linux_wheel" release/
          find release -type f -name '*.tar.gz' -exec cp -t release/ {} +
          printf 'fprime-fpp @ %s/%s ; sys_platform == "linux" and platform_machine == "x86_64"\n' \
            "$base_url" "$(basename "$linux_wheel")" > release/overrides.txt
          # Fail loudly if the flattened assets the publish step uploads are
          # missing, instead of letting a glob silently match nothing.
          ls release/*.whl release/*.tar.gz release/overrides.txt
      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.rel.outputs.tag }}'
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --prerelease \
              --title "Scala Native FPP tools ($tag)" \
              --notes 'Cross-platform Scala Native FPP wheels for this branch baseline.'
          gh release upload "$tag" \
            --repo "${{ github.repository }}" \
            release/*.whl \
            release/*.tar.gz \
            release/overrides.txt \
            --clobber

  pages:
    # GitHub Pages allows a single deployment per repo, so only the main line
    # publishes the PEP 503 simple index. Other branches (release/**) still get
    # their wheels + direct-URL overrides.txt from the publish job above.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download native build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: fpp-scala-native-*
          path: release
          merge-multiple: true
      - name: Generate PEP 503 simple index
        run: |
          tag=fpp-scala-native-latest
          base_url="https://github.com/${{ github.repository }}/releases/download/$tag"
          mkdir -p site/simple/fprime-fpp
          cat > site/simple/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta name="pypi:repository-version" content="1.0">
              <title>Simple index</title>
            </head>
            <body>
              <a href="fprime-fpp/">fprime-fpp</a>
            </body>
          </html>
          EOF
          {
            printf '<!DOCTYPE html>\n<html>\n  <head>\n'
            printf '    <meta name="pypi:repository-version" content="1.0">\n'
            printf '    <title>Links for fprime-fpp</title>\n'
            printf '  </head>\n  <body>\n'
            # Emit one anchor per real wheel, pointing at its release download URL.
            find release -type f -name '*.whl' -printf '%f\n' | sort -u | \
              while IFS= read -r wheel
              do
                printf '    <a href="%s/%s">%s</a>\n' \
                  "$base_url" "$wheel" "$wheel"
              done
            printf '  </body>\n</html>\n'
          } > site/simple/fprime-fpp/index.html
          # Fail loudly if no wheels were found instead of publishing an empty index.
          grep -q '\.whl' site/simple/fprime-fpp/index.html
          cat site/simple/index.html site/simple/fprime-fpp/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
