name: Build Scala Native FPP Tools

on:
  push:
    branches: [ "main", "release/**", "sn/**" ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-14
            artifact: darwin-arm64
            python: '3.10'
            wheel_tag: macosx_14_0_arm64
            jvm_args: -Xmx6G -XX:+UseG1GC
            pgo: false
            gc: immix
            linker: system
            max_inline_depth: 128
            max_caller_size: 4096
            max_callee_size: 1024
            small_function_size: 24
          - runner: ubuntu-22.04
            artifact: manylinux_2_28_x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
            python: /opt/python/cp310-cp310/bin/python
            wheel_tag: manylinux_2_28_x86_64
            jvm_args: -Xmx10G -XX:+UseG1GC
            pgo: false
            gc: immix
            linker: lld
            max_inline_depth: 256
            max_caller_size: 8192
            max_callee_size: 1536
            small_function_size: 36
          - runner: ubuntu-22.04-arm
            artifact: manylinux_2_28_aarch64
            container: quay.io/pypa/manylinux_2_28_aarch64
            python: /opt/python/cp310-cp310/bin/python
            wheel_tag: manylinux_2_28_aarch64
            jvm_args: -Xmx10G -XX:+UseG1GC
            pgo: false
            gc: immix
            linker: lld
            max_inline_depth: 172
            max_caller_size: 6144
            max_callee_size: 1536
            small_function_size: 30
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container || '' }}
      # get us swapon
      options: --privileged
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'

    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch full history and tags so `git describe --tags` can embed a
          # real version below (a shallow checkout has no tags).
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - name: Install sbt
        uses: ./.github/actions/setup-sbt
      - if: runner.os == 'Linux'
        name: Install Linux build tools
        run: |
          dnf install --assumeyes clang llvm lld
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Show toolchain versions
        run: |
          java --version
          sbt --version
          clang --version
      - if: runner.os == 'macOS'
        name: Show macOS linker version
        run: |
          sw_vers
          xcodebuild -version
          ld -v
      - name: Embed version in Version.scala
        working-directory: compiler
        run: |
          # Embed the nearest release tag
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . ../version.sh
          if git describe --tags --abbrev=0 --match 'v*' > /dev/null 2>&1
          then
            version=`git describe --tags --abbrev=0 --match 'v*'`
          else
            version="$VERSION"
          fi
          util=lib/src/main/scala/util
          echo "Updating version to $version"
          sed -i.update.bak -e "s/val v = .*/val v = \"$version\"/" \
            $util/Version.scala
      - if: runner.os == 'Linux'
        name: Reserve swap headroom for the full-LTO links
        shell: bash
        run: |
          sw="${RUNNER_TEMP:-/tmp}/fpp-swapfile"
          gib=8
          echo "::group::disk before swapfile"; df -h "$(dirname "$sw")" || true; echo "::endgroup::"

          if ! dd if=/dev/zero of="$sw" bs=1M count=$((gib * 1024)) status=none
          then
            echo "::warning::could not allocate swapfile; continuing on RAM only"
            exit 0
          fi

          chmod 600 "$sw"
          mkswap "$sw" >/dev/null
          if ! swapon "$sw"
          then
            echo "::warning::swapon failed (needs CAP_SYS_ADMIN); continuing on RAM only"
            rm -f "$sw"
            exit 0
          fi

          echo "Enabled ${gib} GiB swap at $sw"
          swapon --show || true
          free -m || true
      - name: Build instrumented Scala Native tools
        if: matrix.pgo
        uses: ./.github/actions/scala-native-build
        with:
          jvm-args: ${{ matrix.jvm_args }}
          mode: releasefull
          lto: full
          gc: ${{ matrix.gc }}
          linker: ${{ matrix.linker }}
          pgo-mode: generate
          profile-directory: ${{ runner.temp }}/fpp-pgo
          max-inline-depth: ${{ matrix.max_inline_depth }}
          max-caller-size: ${{ matrix.max_caller_size }}
          max-callee-size: ${{ matrix.max_callee_size }}
          small-function-size: ${{ matrix.small_function_size }}
      - name: Build unprofiled Scala Native tools
        if: ${{ !matrix.pgo }}
        uses: ./.github/actions/scala-native-build
        with:
          jvm-args: ${{ matrix.jvm_args }}
          mode: releasefull
          lto: full
          gc: ${{ matrix.gc }}
          linker: ${{ matrix.linker }}
      - name: Stage initial Scala Native tools
        uses: ./.github/actions/scala-native-stage
      - name: Prepare matching F Prime revision
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FPRIME_DIR: ${{ runner.temp }}/fprime
          FPRIME_VENV: ${{ runner.temp }}/fprime-venv
          FPRIME_PYTHON: ${{ matrix.python }}
          FPRIME_PREPARE_ONLY: true
        run: .github/actions/scala-native-profile/build-matching-fprime.sh
      - name: Profile instrumented Scala Native tools
        if: matrix.pgo
        uses: ./.github/actions/scala-native-profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          profile-directory: ${{ runner.temp }}/fpp-pgo
          profile-file: ${{ github.workspace }}/compiler/pgo/fpp.profdata
          python: ${{ matrix.python }}
          fprime-directory: ${{ runner.temp }}/fprime
          fprime-venv: ${{ runner.temp }}/fprime-venv
      - name: Build profile-guided Scala Native tools
        if: matrix.pgo
        uses: ./.github/actions/scala-native-build
        with:
          jvm-args: ${{ matrix.jvm_args }}
          mode: releasefull
          lto: full
          gc: ${{ matrix.gc }}
          linker: ${{ matrix.linker }}
          max-inline-depth: ${{ matrix.max_inline_depth }}
          max-caller-size: ${{ matrix.max_caller_size }}
          max-callee-size: ${{ matrix.max_callee_size }}
          small-function-size: ${{ matrix.small_function_size }}
          pgo-mode: apply
          profile-file: ${{ github.workspace }}/compiler/pgo/fpp.profdata
      - name: Restore Version.scala
        if: always()
        working-directory: compiler
        run: |
          # Restore the committed placeholder so no tracked file is left dirty,
          # exactly as compiler/install does after building.
          util=lib/src/main/scala/util
          echo "Restoring Version.scala"
          sed -i.restore.bak -e "s/val v = .*/val v = \"[unknown version]\"/" \
            $util/Version.scala
      - name: Stage profile-guided Scala Native tools
        if: matrix.pgo
        uses: ./.github/actions/scala-native-stage
      - name: Benchmark F Prime compile
        shell: bash
        env:
          FPRIME_DIR: ${{ runner.temp }}/fprime
          FPRIME_VENV: ${{ runner.temp }}/fprime-venv
        run: |
          export PATH="$GITHUB_WORKSPACE/compiler/bin:$FPRIME_VENV/bin:$PATH"
          export CFLAGS="-Wno-error=overloaded-virtual"
          export CXXFLAGS="$CFLAGS"
          test "$(command -v fpp)" = "$GITHUB_WORKSPACE/compiler/bin/fpp"
          cd "$FPRIME_DIR/TestDeploymentsProject"

          # Recreate the build cache, then compile the deployment
          TIMEFORMAT='FPP_GENERATE_SECONDS=%3R'
          { time fprime-util generate --force; } 2>&1 | tee "$RUNNER_TEMP/fpp-generate-benchmark.log"
          TIMEFORMAT='FPP_BUILD_SECONDS=%3R'
          { time fprime-util build -j4; } 2>&1 | tee "$RUNNER_TEMP/fpp-build-benchmark.log"

          generate=$(sed -n 's/^FPP_GENERATE_SECONDS=//p' "$RUNNER_TEMP/fpp-generate-benchmark.log" | tail -1)
          build=$(sed -n 's/^FPP_BUILD_SECONDS=//p' "$RUNNER_TEMP/fpp-build-benchmark.log" | tail -1)
          test -n "$generate"
          test -n "$build"
          total=$(awk -v generate="$generate" -v build="$build" 'BEGIN { printf "%.3f", generate + build }')
          {
            printf '### %s\n\n' '${{ matrix.artifact }}'
            printf '| Phase | Seconds |\n|---|---:|\n'
            printf '| Generate | %s |\n| Build (`-j4`) | %s |\n| Total | %s |\n' \
              "$generate" "$build" "$total"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test Scala Native tools
        working-directory: compiler
        run: ./test
      - name: Package Scala Native tools
        working-directory: compiler
        run: |
          bundle="fpp-scala-native-${{ matrix.artifact }}"
          mkdir -p "$bundle"
          cp -a bin/. "$bundle"
          tar -czf "$bundle.tar.gz" "$bundle"
      - name: Build Python wheel
        run: |
          cp compiler/bin/fpp python/fprime_fpp/fpp
          chmod +x python/fprime_fpp/fpp
          touch python/fprime_fpp/fpp-native-all-tools
          uv run --python ${{ matrix.python }} --with build python -m build \
            --wheel --outdir dist \
            --config-setting=--build-option=--plat-name=${{ matrix.wheel_tag }} .
      - name: Install wheel with uv
        run: |
          wheel=$(find dist -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          printf 'fprime-fpp @ file://%s\n' "$(pwd)/$wheel" > overrides.txt
          uv venv .venv --python ${{ matrix.python }} --clear
          uv pip install --python .venv/bin/python --override overrides.txt fprime-fpp
          .venv/bin/fpp --help
          .venv/bin/fpp-to-json --help
      - name: Archive Scala Native tools
        uses: actions/upload-artifact@v7
        with:
          name: fpp-scala-native-${{ matrix.artifact }}
          path: |
            compiler/fpp-scala-native-${{ matrix.artifact }}.tar.gz
            dist/*.whl
          retention-days: 14
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: write

    steps:
      - name: Download native build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: fpp-scala-native-*
          path: release
          merge-multiple: true
      - name: Derive release tag from branch
        id: rel
        run: |
          # One rolling release per branch: main -> ...-latest, release/a9 -> ...-a9.
          # Keeps each F Prime baseline (a9, a15, ...) on its own release without
          # per-branch workflow edits.
          slug="${GITHUB_REF_NAME##*/}"
          if [ "$slug" = "main" ]; then slug="latest"; fi
          echo "tag=fpp-scala-native-$slug" >> "$GITHUB_OUTPUT"
      - name: Create release assets
        run: |
          tag='${{ steps.rel.outputs.tag }}'
          base_url="https://github.com/${{ github.repository }}/releases/download/$tag"
          # Downloaded artifacts keep their internal layout
          # (release/dist/*.whl and release/compiler/*.tar.gz), so flatten the
          # real files into release/ root where the publish globs look for them.
          find release -mindepth 2 -type f -name '*.whl' -exec cp -t release/ {} +
          find release -mindepth 2 -type f -name '*.tar.gz' -exec cp -t release/ {} +
          : > release/overrides.txt
          while IFS='|' read -r pattern platform machine
          do
            wheel=$(find release -maxdepth 1 -type f -name "$pattern" -print -quit)
            test -n "$wheel"
            printf 'fprime-fpp @ %s/%s ; sys_platform == "%s" and platform_machine == "%s"\n' \
              "$base_url" "$(basename "$wheel")" "$platform" "$machine" \
              >> release/overrides.txt
          done <<'EOF'
          *manylinux_*_x86_64.whl|linux|x86_64
          *manylinux_*_aarch64.whl|linux|aarch64
          *macosx_*_arm64.whl|darwin|arm64
          EOF
          # Fail loudly if the flattened assets the publish step uploads are
          # missing, instead of letting a glob silently match nothing.
          ls release/*.whl release/*.tar.gz release/overrides.txt
      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.rel.outputs.tag }}'
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --prerelease \
              --title "Scala Native FPP tools ($tag)" \
              --notes 'Cross-platform Scala Native FPP wheels for this branch baseline.'
          gh release upload "$tag" \
            --repo "${{ github.repository }}" \
            release/*.whl \
            release/*.tar.gz \
            release/overrides.txt \
            --clobber
