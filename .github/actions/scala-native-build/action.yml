name: Build Scala Native FPP
description: Link the Scala Native FPP binary with an optional PGO mode

inputs:
  jvm-heap:
    description: Maximum sbt JVM heap, such as 12G; empty uses JVM ergonomics
    required: false
    default: ''
  mode:
    description: Scala Native optimization mode (releasefast|releasefull|debug); empty uses the build default (releasefast)
    required: false
    default: ''
  lto:
    description: Link-time optimization level (none|thin|full); empty uses the build default (thin)
    required: false
    default: ''
  pgo-mode:
    description: Empty for a normal build, or generate/apply for PGO
    required: false
    default: ''
  profile-directory:
    description: Directory for raw profiles during PGO generation
    required: false
    default: ''
  profile-file:
    description: Merged profile file to consume during PGO application
    required: false
    default: ''
  gc:
    description: Scala Native garbage collector (none|immix|commix|boehm)
    required: false
    default: 'immix'
  linker:
    description: Native linker selection (system|lld); lld requires an installed lld executable
    required: false
    default: 'system'
  max-inline-depth:
    description: Scala Native optimizer maximum inline depth
    required: false
    default: '32'
  max-caller-size:
    description: Scala Native optimizer maximum caller size in NIR instructions
    required: false
    default: '2048'
  max-callee-size:
    description: Scala Native optimizer maximum callee size in NIR instructions
    required: false
    default: '256'
  small-function-size:
    description: NIR instruction count that is always considered for inlining
    required: false
    default: '12'

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: compiler
      env:
        FPP_MODE: ${{ inputs.mode }}
        FPP_LTO: ${{ inputs.lto }}
        FPP_PGO: ${{ inputs.pgo-mode }}
        FPP_PGO_DIR: ${{ inputs.profile-directory }}
        FPP_PGO_PROFILE: ${{ inputs.profile-file }}
        FPP_GC: ${{ inputs.gc }}
        FPP_LINKER: ${{ inputs.linker }}
        FPP_MAX_INLINE_DEPTH: ${{ inputs.max-inline-depth }}
        FPP_MAX_CALLER_SIZE: ${{ inputs.max-caller-size }}
        FPP_MAX_CALLEE_SIZE: ${{ inputs.max-callee-size }}
        FPP_SMALL_FUNCTION_SIZE: ${{ inputs.small-function-size }}
        SBT_JVM_HEAP: ${{ inputs.jvm-heap }}
      run: |
        sbt_args=(--batch)
        if [[ -n "$SBT_JVM_HEAP" ]]
        then
          sbt_args+=("-J-Xmx$SBT_JVM_HEAP")
        fi
        # Serialize Scala Native's per-.ll clang compiles (it otherwise spawns
        # one clang per processor). On the 16 GB free runner, releaseFull's
        # concurrent clang -flto processes (~1.6-3.7 GB each) stack on top of the
        # resident JVM heap and OOM-kill the job at the optimize->codegen
        # transition. Capping processors to 1 compiles one .ll at a time
        # (~3.7 GB peak instead of ~10.5 GB); the optimize phase is
        # single-threaded so this doesn't slow it.
        sbt_args+=("-J-XX:ActiveProcessorCount=1")
        if [[ "$FPP_PGO" == generate ]]
        then
          test -n "$FPP_PGO_DIR"
          mkdir -p "$FPP_PGO_DIR"
          find "$FPP_PGO_DIR" -maxdepth 1 -type f -name '*.profraw' -delete
        fi

        # Locate this shell's cgroup v2 dir so we can read the memory
        # high-water mark and OOM-kill counter after the build (works inside the
        # manylinux container without privilege, unlike dmesg).
        cg=/sys/fs/cgroup
        rel=
        if [[ -r /proc/self/cgroup ]]
        then
          rel=$(awk -F: '$1=="0"{print $3}' /proc/self/cgroup 2>/dev/null || true)
        fi
        [[ -n "$rel" && -d "$cg$rel" ]] && cg="$cg$rel"
        echo "::group::memory before build"
        free -m || true
        cat "$cg/memory.max" 2>/dev/null | sed 's/^/memory.max=/' || true
        echo "::endgroup::"

        # Run the link but do NOT let a non-zero exit abort before diagnostics.
        set +e
        sbt "${sbt_args[@]}" "nativeFpp/nativeLink"
        rc=$?
        set -e

        echo "::group::memory after build (rc=$rc)"
        echo "peak(bytes)=$(cat "$cg/memory.peak" 2>/dev/null || echo n/a)"
        echo "memory.max=$(cat "$cg/memory.max" 2>/dev/null || echo n/a)"
        echo "--- memory.events (oom_kill = kernel OOM-killed a process here) ---"
        cat "$cg/memory.events" 2>/dev/null || echo "unavailable"
        echo "--- free -m ---"; free -m || true
        echo "--- dmesg OOM lines (usually denied in container) ---"
        dmesg 2>/dev/null | grep -iE "killed process|out of memory|oom-kill" | tail -5 || echo "dmesg unavailable"
        echo "::endgroup::"

        if [[ $rc -ne 0 ]]; then
          peak=$(cat "$cg/memory.peak" 2>/dev/null || echo 0)
          oom=$(awk '/^oom_kill /{print $2}' "$cg/memory.events" 2>/dev/null || echo 0)
          echo "::error::nativeLink failed (rc=$rc). cgroup peak=${peak} bytes, oom_kill=${oom:-0}. rc=137 + oom_kill>0 => OOM."
        fi
        exit $rc
